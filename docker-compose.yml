services:
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: salow-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Port
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salow-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
    depends_on:
      - mailpit
    volumes:
      - .:/app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --graceful-timeout 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salow-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
    depends_on:
      - web
    volumes:
      - .:/app
    command: python manage.py process_email_outbox --loop --interval 10

volumes:
  mailpit_data:
