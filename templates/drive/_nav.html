<div class="drive-tabs">
  <a href="{% url 'drive:home' %}" class="{% if tab == 'mine' %}active{% endif %}">My Drive</a>
  <a href="{% url 'drive:shared' %}" class="{% if tab == 'shared' %}active{% endif %}">Shared with me</a>
  <a href="{% url 'drive:trash' %}" class="{% if tab == 'trash' %}active{% endif %}">Trash</a>
</div>
<div class="drive-notice">Files you add stay on this device. Drive records only their name, size and a checksum. Sending a file to someone else's device is not available yet. Folders, names, sharing and trash work now.</div>
