{% for m in rows %}<div class="chat-msg{% if m.author_id == me.pk %} mine{% endif %}" data-seq="{{ m.seq }}"><span class="chat-who">{{ m.author.full_name }} ({{ m.author.employee_id }})</span> <span class="cal-meta">{{ m.created_at|date:"j M, H:i" }}</span><div class="chat-body">{{ m.body|linebreaksbr }}</div></div>{% endfor %}
<div id="chat-tail" hx-get="{% url 'chat:poll' space.public_id %}?after={{ last }}" hx-trigger="every 10s" hx-swap="outerHTML" hx-select-oob="" data-last="{{ last }}">{% if more %}<a href="{% url 'chat:space' space.public_id %}">More messages: reload</a>{% endif %}</div>
