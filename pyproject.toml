[project]
name = "salow-workspace"
version = "0.1.0"
description = "Salow Workspace — Internal Operating System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2.17,<5.3.0",
    "django-tidb>=5.2.0,<5.3.0",
    "mysqlclient>=2.2.4",
    "pymysql>=1.1.0",
    "gunicorn>=23.0.0",
    "python-dotenv>=1.0.1",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "certifi>=2024.8.30",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "webauthn>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.0",
]

asgi = [
    # Only needed to run the optional SSE push (config.asgi). The default gunicorn sync deployment
    # does not use it and the live feed falls back to polling.
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
]
ignore = [
    "S101", # allow assert in tests
    "E501", # allow line lengths formatted by ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"tests/browser/*" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/*" = ["S101", "S105", "S608", "C901", "E402"]
"config/settings/*" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
