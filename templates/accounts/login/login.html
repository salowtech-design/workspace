{% extends "base.html" %}

{% block title %}Sign In — Salowtech Workspace{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 3rem auto; text-align: center;">
    <div style="margin-bottom: 1.5rem;">
        <img src="/static/img/logo.jpg" alt="Salowtech Logo" style="height: 68px; width: 68px; object-fit: contain; margin-bottom: 0.5rem;">
        <h2 style="margin: 0; font-size: 1.5rem; color: var(--color-primary-600);">Salowtech Workspace</h2>
        <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
            Sign in with your company credentials
        </p>
    </div>

    {% if error %}
    <div class="alert alert-danger" style="margin-bottom: 1.25rem; text-align: left;">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-4" style="text-align: left;">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
            <label for="employee_id" class="form-label">Employee ID</label>
            <input type="text" id="employee_id" name="employee_id" class="form-input" placeholder="e.g. ST-EMP-0001" autocomplete="username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1rem; padding: 0.75rem;">
            Continue →
        </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--color-border-subtle); font-size: 0.85rem; color: var(--color-text-muted);">
        First time joining? <a href="{% url 'accounts:activate' %}" style="color: var(--color-primary-600); font-weight: 600;">Activate with code</a>
    </div>
</div>
{% endblock %}
