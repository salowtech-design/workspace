<!-- HTMX Append-Only Events Fragment with Cursor Tracking -->
<div id="events-container">
    {% for evt in events %}
    <div class="event-row s-45accc28" id="evt-{{ evt.id }}">
        <div class="s-19da9de9">
            <code class="s-98692c33">#{{ evt.id }}</code>
            <span class="s-0828166a">{{ evt.time }}</span>
            <strong class="s-c70bb0fc">{{ evt.event }}</strong>
            <span class="badge s-ef2ec3ba">{{ evt.code }}</span>
            <span class="s-8f573919">{{ evt.employee_id }}</span>
        </div>
        <div class="s-90142cb3">
            <span>IP: {{ evt.network_address }}</span>
            <span>Ref: <code>{{ evt.reference_id|default:"-" }}</code></span>
        </div>
    </div>
    {% empty %}
    <div class="s-8c23e7d3">
        No new security events available beyond cursor.
    </div>
    {% endfor %}
</div>

<!-- Next Polling Trigger with Cursor ID -->
{% if latest_id %}
<div id="secops-poll-trigger"
     hx-get="{% url 'security_events_root' %}?after={{ latest_id }}"
     hx-trigger="every 15s"
     hx-target="#events-container"
     hx-swap="beforeend">
</div>
{% endif %}
