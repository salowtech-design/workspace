<div id="comment-thread" class="s-f52651be">
  {% for comment in comments %}
  <div class="s-4b4e895e">
    <div class="s-9189613f">
      <div class="s-d240493b">
        {{ comment.author.full_name }} ({{ comment.author.employee_id }})
      </div>
      <div class="s-190b5458">
        {{ comment.created_at|timesince }} ago
      </div>
    </div>
    <div class="s-b04b3b10">
      {{ comment.content }}
    </div>
  </div>
  {% empty %}
  <div class="s-d1b35845">
    No comments yet. Start the conversation!
  </div>
  {% endfor %}
</div>
