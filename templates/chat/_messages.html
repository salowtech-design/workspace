{% for m in rows %}<div class="chat-msg{% if m.author_id == me.pk %} mine{% endif %}" id="m{{ m.seq }}" data-seq="{{ m.seq }}"><span class="chat-who">{{ m.author.full_name }} ({{ m.author.employee_id }})</span> <span class="cal-meta">{{ m.created_at|date:"j M, H:i" }}</span><div class="chat-body">{{ m.body|linebreaksbr }}</div><form method="post" action="{% url 'chat:react' space.public_id %}" class="chat-react">{% csrf_token %}<input type="hidden" name="seq" value="{{ m.seq }}">{% for key, emoji, label, count, mine in m.reacts %}<button type="submit" name="kind" value="{{ key }}" class="chat-react-btn{% if mine %} on{% endif %}" aria-pressed="{% if mine %}true{% else %}false{% endif %}" aria-label="{{ label }}{% if count %}, {{ count }}{% endif %}{% if mine %}, you reacted{% endif %}" title="{{ label }}">{{ emoji }}{% if count %} {{ count }}{% endif %}</button>{% endfor %}</form></div>{% endfor %}
